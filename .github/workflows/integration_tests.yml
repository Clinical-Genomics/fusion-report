name: Integration Tests

on:
  pull_request:
    branches: [master]

jobs:
  test-no-cosmic:
    name: Integration test (Mitelman + FusionGDB2)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies & package
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          python setup.py install

      # PR CI does not depend on remote sources (see #100): `download` builds the databases
      # from small fixtures. Remote sources are checked by the scheduled check_sources workflow.
      - name: Build databases with download (local fixtures, no COSMIC)
        run: |
          fusion_report download --no-cosmic \
            --mitelman-file tests/test_data/mitelman_mini.zip \
            --fusiongdb2-file tests/test_data/fusiongdb2_mini.txt \
            ./db
          test -f ./db/db_manifest.json && echo "Manifest OK"

      - name: Test run (no COSMIC)
        run: |
          fusion_report run "example-sample" ./docs/example ./db/ \
            --no-cosmic \
            --arriba tests/test_data/arriba.tsv \
            --fusioncatcher tests/test_data/fusioncatcher.txt \
            --starfusion tests/test_data/starfusion.tsv \
            --ctat_lr_fusion tests/test_data/ctat_lr_fusion.tsv \
            --export csv

      - name: Verify output exists
        run: |
          test -f ./docs/example/fusions.csv && echo "CSV export OK"
          test -f ./docs/example/index.html && echo "Report OK"

  test-full:
    name: Integration test (all databases)
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies & package
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          python setup.py install

      # Only COSMIC is downloaded live (it needs the repository secrets).
      - name: Download COSMIC, build the other databases from fixtures
        run: |
          fusion_report download \
            --cosmic_usr "${{ secrets.COSMIC_USERNAME }}" --cosmic_passwd "${{ secrets.COSMIC_PASSWD }}" \
            --mitelman-file tests/test_data/mitelman_mini.zip \
            --fusiongdb2-file tests/test_data/fusiongdb2_mini.txt \
            ./db

      - name: Test run (all databases)
        run: |
          fusion_report run "example-sample" ./docs/example ./db/ \
            --arriba tests/test_data/arriba.tsv \
            --fusioncatcher tests/test_data/fusioncatcher.txt \
            --starfusion tests/test_data/starfusion.tsv \
            --ctat_lr_fusion tests/test_data/ctat_lr_fusion.tsv \
            --export csv

  test-createdb:
    name: Integration test (createdb from local files)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies & package
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          python setup.py install

      # Small fixtures in the Mitelman and FusionGDB2 formats (see #100).
      - name: Create databases from local files
        run: |
          fusion_report createdb ./db \
            --mitelman tests/test_data/mitelman_mini.zip \
            --fusiongdb2 tests/test_data/fusiongdb2_mini.txt

      - name: Verify databases created
        run: |
          test -f ./db/mitelman.db && echo "Mitelman DB OK"
          test -f ./db/fusiongdb2.db && echo "FusionGDB2 DB OK"
          test -f ./db/DB-timestamp.txt && echo "Timestamp OK"
          test -f ./db/db_manifest.json && echo "Manifest OK"

      - name: Test run with created databases
        run: |
          fusion_report run "example-sample" ./docs/example ./db/ \
            --no-cosmic \
            --arriba tests/test_data/arriba.tsv \
            --fusioncatcher tests/test_data/fusioncatcher.txt \
            --starfusion tests/test_data/starfusion.tsv \
            --ctat_lr_fusion tests/test_data/ctat_lr_fusion.tsv \
            --export csv
